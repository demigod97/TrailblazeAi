services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ../.env
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - trailblaze
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    env_file:
      - ../.env
    ipc: host
    deploy:
      resources:
        limits:
          memory: 3G
    networks:
      - trailblaze
    restart: unless-stopped

networks:
  trailblaze:
    driver: bridge
