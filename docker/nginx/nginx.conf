# Nginx reverse proxy configuration for TrailBlazeAI
# Routes /api/* to Fastify API server
# Handles SSL termination and HTTP->HTTPS redirect

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Logging
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  # Upstream API server
  upstream api {
    server api:3001;
  }

  # HTTP server - redirect to HTTPS
  server {
    listen 80;
    server_name _;

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server with SSL termination
  server {
    listen 443 ssl http2;
    server_name _;

    # SSL certificates — set DOMAIN_NAME env var in docker-compose or .env before starting.
    # Bootstrap certbot first:
    #   docker run --rm -v certbot-conf:/etc/letsencrypt certbot/certbot certonly \
    #     --standalone -d $DOMAIN_NAME
    # docker-compose automatically substitutes $DOMAIN_NAME via envsubst on startup.
    ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logging
    access_log /var/log/nginx/https_access.log;
    error_log /var/log/nginx/https_error.log;

    # API routes - proxy to Fastify backend
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;

      # Headers for proxying
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Timeouts
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # Buffering
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # Health check endpoint (unproxied, for monitoring)
    location /health {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Default location
    location / {
      return 404;
    }
  }
}
